<head>
<meta charset="UTF-8">
<meta name="author" content="Asyraf Abdul">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tender Evaluation Matrix</title>
<style>
:root{
  --navy:#1F3864; --teal:#2E75B6; --ink:#1d2433; --muted:#5b6475; --line:#d9dee7; --bg:#f4f6fa; --card:#fff;
  --input:#fff8e1; --inputline:#e9d38f; --pass:#1e7b3a; --passbg:#dcf3e2; --fail:#a1112b; --failbg:#fde1e6;
  --warn:#8a5a00; --warnbg:#fff1c7; --hi:#e3eefb;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Arial,Helvetica,sans-serif;font-size:13.5px;color:var(--ink);background:var(--bg)}
header{background:var(--navy);color:#fff;padding:14px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
header h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.2px}
header .sub{font-size:12px;opacity:.8}
header .spacer{flex:1}
.btn{border:1px solid rgba(255,255,255,.45);background:transparent;color:#fff;padding:6px 12px;border-radius:6px;font-size:12.5px;cursor:pointer}
.btn:hover{background:rgba(255,255,255,.12)}
.btn.solid{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.dark{border-color:var(--line);color:var(--ink);background:#fff}
.btn.dark:hover{background:#eef2f8}
.status{background:#fff;border-bottom:1px solid var(--line);padding:10px 24px;display:flex;gap:26px;flex-wrap:wrap;font-size:12.5px}
.status b{font-size:14px}
.status .k{color:var(--muted);display:block;font-size:11px;text-transform:uppercase;letter-spacing:.4px}
nav{display:flex;gap:2px;padding:0 24px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:0;z-index:5}
nav button{border:0;background:none;padding:12px 14px;font-size:13px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:var(--navy);border-bottom-color:var(--teal);font-weight:600}
nav .num{display:inline-block;width:18px;height:18px;line-height:18px;border-radius:50%;background:#e8edf5;color:var(--navy);font-size:11px;text-align:center;margin-right:6px}
nav button.on .num{background:var(--teal);color:#fff}
main{padding:22px 24px 60px;max-width:1500px}
h2{font-size:18px;margin:0 0 4px;color:var(--navy)}
.lead{color:var(--muted);margin:0 0 18px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:18px}
.card h3{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--teal)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:18px}
.form{display:grid;grid-template-columns:220px 1fr;gap:8px 12px;align-items:center}
.form label{font-weight:600;font-size:12.5px}
input,select,textarea{font:inherit;color:#1a3fbf;background:var(--input);border:1px solid var(--inputline);border-radius:5px;padding:6px 8px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--teal);outline-offset:-1px;background:#fff}
textarea{min-height:90px;resize:vertical}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;background:#fff}
th{background:var(--navy);color:#fff;font-weight:600;font-size:12px;padding:8px 6px;text-align:center;border:1px solid #2c4a7c;vertical-align:middle}
th.l,td.l{text-align:left}
td{border:1px solid var(--line);padding:4px 6px;text-align:center;vertical-align:middle}
td input,td select{padding:4px 6px;border-radius:4px}
td.calc{background:#f3f5f9;font-variant-numeric:tabular-nums}
td.b,tr.tot td{font-weight:700}
tr.tot td{background:#eef2f8}
td.no{color:var(--muted);width:34px}
.pill{display:inline-block;padding:2px 9px;border-radius:12px;font-weight:700;font-size:11.5px}
.PASS,.Yes{background:var(--passbg);color:var(--pass)}
.FAIL,.No{background:var(--failbg);color:var(--fail)}
.INCOMPLETE,.Open{background:var(--warnbg);color:var(--warn)}
.amber{background:var(--warnbg)!important;color:var(--warn);font-weight:700}
.red{background:var(--failbg)!important;color:var(--fail);font-weight:700}
.green{background:var(--passbg)!important;color:var(--pass);font-weight:700}
button.add{border:1px dashed var(--teal);background:#f3f8fe;color:var(--teal);font-weight:600;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12.5px}
button.add:hover{background:#e3eefb}
button.del{border:0;background:none;color:#a7aebb;font-size:18px;line-height:1;cursor:pointer;padding:2px 6px;border-radius:4px}
button.del:hover{background:var(--failbg);color:var(--fail)}
tr.win td{background:var(--hi)!important;font-weight:700;color:var(--navy)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:#fff;border-radius:18px;padding:6px 14px;cursor:pointer;font-size:12.5px}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.chip small{opacity:.75;margin-left:6px}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi .k{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
.kpi .v{font-size:18px;font-weight:700;margin-top:4px;color:var(--navy)}
.bars{display:flex;flex-direction:column;gap:8px}
.bar-row{display:grid;grid-template-columns:220px 1fr 60px;gap:10px;align-items:center;font-size:12.5px}
.bar{height:20px;background:#eef1f6;border-radius:4px;display:flex;overflow:hidden}
.bar .t{background:var(--navy)}.bar .c{background:#7fb2e5}
.legend{font-size:11.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;margin:0 4px 0 12px;vertical-align:middle}
.warnbox{background:var(--warnbg);border:1px solid #f0d58a;color:var(--warn);padding:8px 12px;border-radius:6px;margin-bottom:14px;font-size:12.5px}
.help li{margin-bottom:6px}
.hidden{display:none}
.printhead{display:none}
.trialbar{background:#fff3d6;border:1px solid #f0d58a;color:#7a4b00;border-radius:8px;padding:6px 12px;display:flex;align-items:center;gap:10px}
.trialbar a{color:#7a4b00;font-weight:700}
.lockcard{text-align:center;padding:48px 24px}
.lockcard .btn.solid{display:inline-block;text-decoration:none;margin-top:8px}
@media print{ body.trial::after{content:"TRIAL VERSION";position:fixed;top:42%;left:0;right:0;text-align:center;font-size:110px;font-weight:800;color:rgba(160,0,0,.12);transform:rotate(-24deg);-webkit-print-color-adjust:exact;print-color-adjust:exact} }
@media print{
  header,nav,.status,.noprint,.btn{display:none!important}
  body{background:#fff;font-size:11px}
  main{padding:0;max-width:none}
  .card{border:1px solid #ccc;break-inside:avoid}
  .printhead{display:block;margin-bottom:10px}
  input,select,textarea{border:0;background:none;color:#000;padding:0}
  th{background:#1F3864!important;color:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pill,.green,.red,.amber,tr.win td,.bar .t,.bar .c{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<header id="hdr"></header>
<input type="file" id="imp" accept=".json" class="hidden" onchange="importJSON(event)">
<input type="file" id="packin" accept=".json" class="hidden" onchange="readFiles(event, openPack)">
<input type="file" id="scorein" accept=".json" multiple class="hidden" onchange="readFiles(event, importScores)">
<div class="status" id="status"></div>
<nav id="nav"></nav>
<main id="main"></main>

<script id="app">
/* Tender Evaluation Matrix · MIT License · Copyright (c) 2026 Asyraf Abdul */
const NB = 6, NE = 5, NR0 = 8, NC0 = 10, NCL = 30;
let KEY = 'tender-eval-matrix-v1';
const TRIAL = null;   // (trial copies are not part of the open-source edition)
let trialState = null;
const TABS = [
  ['setup','Setup'],['compliance','Compliance'],['technical','Technical'],['packs','Panel Packs'],['scoring','Evaluator Scoring'],
  ['panel','Panel Review'],['clar','Clarifications'],['commercial','Commercial'],['summary','Summary'],
  ['sens','Sensitivity'],['help','How to use']
];
const SCALE_DEF = ['Not addressed / unacceptable','Major gaps or serious risk','Partly meets requirement; notable weaknesses',
  'Meets requirement','Meets requirement with some added value','Exceeds requirement; clear added value, low risk'];

const arr = (n, f) => Array.from({length:n}, (_, i) => typeof f === 'function' ? f(i) : f);
const uid = () => 'T' + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2,6).toUpperCase();
function hash(str){ let h = 5381; for(let i=0;i<str.length;i++) h = ((h<<5)+h+str.charCodeAt(i))|0; return (h>>>0).toString(36).toUpperCase(); }
function fingerprint(bidders, criteria){
  let n = criteria.length;   // ignore empty lines at the end (adding a blank line shouldn't outdate forms)
  while(n && !String(criteria[n-1].text||'').trim() && !(typeof criteria[n-1].w==='number' && isFinite(criteria[n-1].w))) n--;
  return hash(JSON.stringify([bidders.map(x=>String(x||'').trim()),
    criteria.slice(0,n).map(c=>[String(c.text||'').trim(), (typeof c.w==='number'&&isFinite(c.w)) ? +c.w.toFixed(6) : null])]));
}
const newReq = () => ({text:'',ans:arr(NB,''),note:''});
const newCrit = () => ({cat:'',text:'',w:null});
/* keep score/comment grids the same length as the criteria list */
function normalize(st){
  const n = st.criteria.length;
  st.scores = arr(NE, e => arr(n, k => (st.scores[e] && st.scores[e][k]) ? st.scores[e][k] : arr(NB,null)));
  st.comments = arr(NE, e => arr(n, k => (st.comments[e] && st.comments[e][k]) || ''));
  return st;
}
function addReq(){ S.reqs.push(newReq()); save(); keepScroll(); focusLast('reqs'); }
function delReq(k){
  const r = S.reqs[k];
  if((r.text.trim() || r.ans.some(a=>a)) && !confirm(`Delete requirement ${k+1}${r.text.trim()?` “${r.text.trim()}”`:''}?`)) return;
  S.reqs.splice(k,1); if(!S.reqs.length) S.reqs.push(newReq()); save(); keepScroll();
}
function addCrit(){ S.criteria.push(newCrit()); normalize(S); save(); keepScroll(); focusLast('criteria'); }
function delCrit(k){
  const c = S.criteria[k], scored = S.scores.some(g=>g[k] && g[k].some(isNum));
  if((c.text.trim() || isNum(c.w) || scored) && !confirm(`Delete criterion ${k+1}${c.text.trim()?` “${c.text.trim()}”`:''}${scored?' and all evaluator scores for it':''}?`)) return;
  S.criteria.splice(k,1); S.scores.forEach(g=>g.splice(k,1)); S.comments.forEach(g=>g.splice(k,1));
  if(!S.criteria.length){ S.criteria.push(newCrit()); normalize(S); }
  save(); keepScroll();
}
function keepScroll(){ const y = window.scrollY; render(); window.scrollTo(0,y); }
function focusLast(kind){
  const els = document.querySelectorAll(`input[data-k^="${kind}."][data-k$=".text"]`);
  if(els.length) els[els.length-1].focus();
}
function blank(){
  return {
    tenderId: uid(), packs: arr(NE,null), subs: arr(NE,null),
    project:{title:'',ref:'',client:'',date:'',currency:'USD',budget:null,techW:0.7,pass:0.6,method:'Average'},
    scale:SCALE_DEF.slice(),
    bidders:arr(NB,''), evaluators:arr(NE,''),
    reqs:arr(NR0,()=>newReq()),
    criteria:arr(NC0,()=>newCrit()),
    scores:arr(NE,()=>arr(NC0,()=>arr(NB,null))),
    comments:arr(NE,()=>arr(NC0,'')),
    clar:arr(NCL,()=>({bidder:'',type:'',q:'',sent:'',resp:'',recv:'',cost:null,status:''})),
    price:arr(NB,null), corr:arr(NB,null), other:arr(NB,null),
    terms:['Completion / delivery (weeks)','Payment terms','Bid validity (days)','Warranty (months)','Liquidated damages accepted?','Commercial deviations / qualifications']
      .map(l=>({label:l,vals:arr(NB,'')})),
    sens:[0.4,0.5,0.6,0.7,0.8,0.9],
    recommendation:'',
    approvals:['Prepared by','Reviewed by','Approved by'].map(r=>({role:r,name:'',desig:'',date:''})),
    coi:arr(NE,()=>({ok:'',date:''}))
  };
}

function example(){
  const s = blank();
  Object.assign(s.project,{title:'Supply, Installation & Commissioning of 2 x 500RT Chiller Plant',ref:'TND-2026-014',
    client:'Example Manufacturing Co.',date:'2026-11-11',currency:'USD',budget:1200000,techW:0.7,pass:0.6,method:'Average'});
  s.bidders = ['Northbridge Engineering','Coastal M&E Contractors','Summit Cooling Systems','Vertex Building Services','',''];
  s.evaluators = ['A. Rahman – Project Engineering','S. Lee – Maintenance','K. Kumar – HSE','',''];
  const reqs = ['Bid submitted before closing date/time','Form of Tender signed by authorised person','Bid bond / tender security provided',
    'Valid company registration & required licences','Bid validity at least 90 days','Price schedule fully completed',
    'Acceptance of contract conditions (or deviations listed)','HSE policy and method statement submitted'];
  reqs.forEach((t,k)=>{ s.reqs[k].text=t; for(let b=0;b<4;b++) s.reqs[k].ans[b]='Yes'; });
  s.reqs[2].ans[3]='No'; s.reqs[2].note='Vertex: no bid bond enclosed with submission';
  const crit = [['Technical','Compliance with specification & scope understanding',.15],['Technical','Equipment make/model & energy efficiency',.15],
    ['Delivery','Method statement & installation approach',.10],['Delivery','Programme & lead time',.10],
    ['Capability','Relevant experience (similar projects, last 5 years)',.10],['Capability','Key personnel & site team',.08],
    ['HSE / Quality','HSE plan & safety record',.08],['HSE / Quality','Testing & commissioning plan (FAT/SAT)',.07],
    ['After-sales','Warranty & after-sales service',.07],['After-sales','Spare parts & local support',.05],['HSE / Quality','Quality plan / ISO 9001',.05]];
  crit.forEach((c,k)=>{ s.criteria[k]={cat:c[0],text:c[1],w:c[2]}; }); normalize(s);
  const base=[[4,4,4,3,4,4,4,4,3,4,4],[4,3,3,4,3,3,4,3,4,3,3],[2,3,2,3,2,2,3,2,3,2,3],[4,4,3,4,4,3,3,3,4,3,4]];
  const EV=[base,
    [[4,5,4,3,4,4,4,4,3,4,4],[4,3,4,4,3,3,4,3,4,3,3],[2,3,2,3,2,2,3,2,3,2,3],[4,4,3,4,4,3,3,3,4,3,4]],
    [[3,4,4,3,4,4,4,4,4,4,4],[4,3,2,4,3,3,4,3,4,3,3],[3,3,2,3,2,2,3,2,3,2,3],[4,3,3,4,4,3,3,3,4,3,4]]];
  EV.forEach((ev,e)=>ev.forEach((row,b)=>row.forEach((v,c)=>{ s.scores[e][c][b]=v; })));
  s.comments[1][2]='Coastal method statement well sequenced'; s.comments[2][2]='Coastal method statement lacks lifting plan detail';
  s.clar[0]={bidder:'Coastal M&E Contractors',type:'Commercial',q:'Price schedule excludes incoming electrical connection to chiller MCC. Please confirm.',sent:'2026-10-28',resp:'Confirmed excluded. Can add for 45,000.',recv:'2026-10-30',cost:45000,status:'Closed'};
  s.clar[1]={bidder:'Northbridge Engineering',type:'Technical',q:'Confirm chiller part-load efficiency (IPLV) at AHRI conditions.',sent:'2026-10-28',resp:'IPLV 0.42 kW/RT confirmed; datasheet attached.',recv:'2026-10-31',cost:0,status:'Closed'};
  s.clar[2]={bidder:'Summit Cooling Systems',type:'Technical',q:'Method statement for rigging and lifting not submitted.',sent:'2026-10-28',resp:'',recv:'',cost:null,status:'Open'};
  s.price=[1250000,1120000,980000,1090000,null,null]; s.corr=[0,0,0,3200,null,null]; s.other=[0,0,0,0,null,null];
  const tv=[[16,14,18,15],['30/60/10','20/70/10','40/50/10','30/60/10'],[90,120,90,90],[24,18,12,24],['Yes','Yes','With cap','Yes'],
    ['None','Electrical connection excluded','Retention reduced to 5%','None']];
  tv.forEach((vals,i)=>vals.forEach((v,b)=>{ s.terms[i].vals[b]=String(v); }));
  s.recommendation='Northbridge Engineering is recommended: fully compliant, highest combined technical score from the 3-person panel (77.1%) and within 4.2% of budget. Coastal M&E is 6.8% cheaper after add-backs but scored lower on equipment efficiency and method statement. Summit (lowest price) did not meet the 60% technical pass mark; Vertex did not provide a bid bond. Note: Coastal would win only if commercial weight were raised to 60%.';
  for(let e=0;e<3;e++) s.coi[e].ok='Yes';
  s.reqs = s.reqs.slice(0, reqs.length); s.criteria = s.criteria.slice(0, crit.length); normalize(s);
  s.tenderId = 'EXAMPLE-CHILLER-2026';
  const fp = fingerprint(s.bidders, s.criteria);
  for(let e=0;e<3;e++){ s.packs[e]={at:'2026-10-27T09:00:00', fp}; s.subs[e]={at:'2026-11-0'+(4+e)+'T16:30:00', name:s.evaluators[e]}; }
  return s;
}

/* MODE: 'lead' = full tool; 'eval' = locked evaluator mode (own pack only) */
let S, EVS = null, EVKEY = null, MODE = 'lead', tab = 'setup', curEval = 0;
function save(){
  try{
    if(MODE==='eval' && EVKEY) localStorage.setItem(EVKEY, JSON.stringify(EVS));
    else localStorage.setItem(KEY, JSON.stringify(S));
    if(!window.EMBED_PACK) localStorage.setItem(KEY+'-mode', JSON.stringify({mode:MODE, key:EVKEY}));
  }catch(e){}
}
function load(){
  try{ const raw = localStorage.getItem(KEY); if(raw){ const b = blank(); return normalize(Object.assign(b, JSON.parse(raw))); } }catch(e){}
  return example();
}
function loadMode(){
  try{
    const m = JSON.parse(localStorage.getItem(KEY+'-mode') || 'null');
    if(m && m.mode==='eval' && m.key){ const ev = JSON.parse(localStorage.getItem(m.key) || 'null'); if(ev && ev.pack){ EVS=ev; EVKEY=m.key; MODE='eval'; } }
  }catch(e){}
}

/* ---------- helpers ---------- */
const esc = v => String(v ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isNum = v => typeof v === 'number' && isFinite(v);
const pct = (v,d=1) => isNum(v) ? (v*100).toFixed(d)+'%' : '';
const money = v => isNum(v) ? v.toLocaleString(undefined,{maximumFractionDigits:0}) : '';
const sgnPct = v => isNum(v) ? (v>0?'+':'')+(v*100).toFixed(1)+'%' : '';
const bname = b => S.bidders[b].trim() || ('Bidder '+(b+1));
const ename = e => S.evaluators[e].trim() || ('Evaluator '+(e+1));
const active = b => S.bidders[b].trim() !== '' && (!TRIAL || b < TRIAL.maxBidders);
const pill = t => t ? `<span class="pill ${esc(t.split(' ')[0])}">${esc(t)}</span>` : '';
const median = a => { const s=[...a].sort((x,y)=>x-y), m=s.length>>1; return s.length%2 ? s[m] : (s[m-1]+s[m])/2; };
const avg = a => a.reduce((x,y)=>x+y,0)/a.length;

function inp(path, val, type='text', extra=''){
  let v = val;
  if(type==='pct') v = isNum(val) ? +(val*100).toFixed(4) : '';
  if(type==='num') v = isNum(val) ? val : '';
  const t = (type==='pct'||type==='num') ? 'number' : (type==='date'?'date':'text');
  return `<input type="${t}" data-k="${path}" data-t="${type}" value="${esc(v)}" ${extra}>`;
}
function sel(path, val, opts, extra=''){
  return `<select data-k="${path}" data-t="sel" ${extra}><option value=""></option>${opts.map(o=>`<option ${String(o)===String(val)?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
}
function setPath(path, raw, type){
  const keys = path.split('.'); let o = MODE==='eval' ? EVS : S;
  for(let i=0;i<keys.length-1;i++) o = o[keys[i]];
  let v = raw;
  if(type==='num'){ v = raw === '' ? null : parseFloat(raw); if(!isFinite(v)) v = null; }
  if(type==='pct'){ v = raw === '' ? null : parseFloat(raw)/100; if(!isFinite(v)) v = null; }
  if(type==='score'){ v = raw === '' ? null : parseInt(raw,10); }
  o[keys[keys.length-1]] = v;
}

/* ---------- calculation engine (mirrors the Excel workbook) ---------- */
function compute(){
  const C = {};
  const B = [...Array(NB).keys()], E = [...Array(NE).keys()], K = [...Array(S.criteria.length).keys()];
  const W = isNum(S.project.techW) ? S.project.techW : 0;
  // compliance
  const reqIdx = S.reqs.map((r,i)=>r.text.trim()?i:-1).filter(i=>i>=0);
  C.comp = B.map(b=>{
    if(!active(b)) return {status:''};
    let no=0, un=0;
    reqIdx.forEach(i=>{ const a=S.reqs[i].ans[b]; if(a==='No') no++; else if(!['Yes','N/A'].includes(a)) un++; });
    return {no, un, status: no>0?'FAIL':(un>0?'INCOMPLETE':'PASS')};
  });
  // technical
  const crit = K.filter(k=>isNum(S.criteria[k].w));
  C.totalW = crit.reduce((s,k)=>s+S.criteria[k].w,0);
  C.nCrit = crit.length;
  C.comb = K.map(k=>B.map(b=>{
    const v = E.map(e=>S.scores[e][k][b]).filter(isNum);
    if(!v.length) return null;
    return S.project.method==='Median' ? median(v) : avg(v);
  }));
  const techOf = grid => B.map(b=>{
    if(!active(b) || C.totalW===0) return null;
    const n = K.filter(k=>isNum(grid[k][b])).length; if(!n) return null;
    return crit.reduce((s,k)=>s+S.criteria[k].w*(isNum(grid[k][b])?grid[k][b]:0),0)/5/C.totalW;
  });
  C.tech = techOf(C.comb);
  C.scored = B.map(b=>crit.filter(k=>isNum(C.comb[k][b])).length);
  C.techRes = B.map(b=> C.tech[b]===null ? '' : (C.scored[b]<C.nCrit ? 'INCOMPLETE' : (C.tech[b] >= (S.project.pass||0) ? 'PASS':'FAIL')));
  C.evTech = E.map(e=>techOf(S.scores[e]));
  C.evCount = E.map(e=>K.reduce((s,k)=>s+B.filter(b=>isNum(S.scores[e][k][b])).length,0));
  C.evScored = E.map(e=>B.map(b=>crit.filter(k=>isNum(S.scores[e][k][b])).length));
  C.spread = K.map(k=>B.map(b=>{ const v=E.map(e=>S.scores[e][k][b]).filter(isNum); return v.length<2?null:Math.max(...v)-Math.min(...v); }));
  C.flags = K.reduce((s,k)=>s+B.filter(b=>active(b)&&isNum(C.spread[k][b])&&C.spread[k][b]>=2).length,0);
  const topOf = arr => { let m=-1,i=-1; arr.forEach((v,b)=>{ if(isNum(v)&&v>m){m=v;i=b;} }); return i; };
  C.evTop = E.map(e=>C.evCount[e]?topOf(C.evTech[e]):-1);
  C.combTop = topOf(C.tech);
  const used = E.filter(e=>C.evCount[e]>0);
  C.agree = used.length ? (used.every(e=>C.evTop[e]===C.combTop) ? 'Yes' : 'No') : '';
  // commercial
  C.addback = B.map(b=> active(b) ? S.clar.filter(c=>c.bidder===S.bidders[b] && c.bidder).reduce((s,c)=>s+(isNum(c.cost)?c.cost:0),0) : null);
  C.evalP = B.map(b=> (active(b) && isNum(S.price[b])) ? S.price[b]+(S.corr[b]||0)+(C.addback[b]||0)+(S.other[b]||0) : null);
  C.varB = B.map(b=> (isNum(C.evalP[b]) && isNum(S.project.budget) && S.project.budget) ? C.evalP[b]/S.project.budget-1 : null);
  C.pRank = B.map(b=> isNum(C.evalP[b]) ? C.evalP.filter(p=>isNum(p)&&p<C.evalP[b]).length+1 : null);
  // summary
  C.elig = B.map(b=> active(b) ? (C.comp[b].status==='PASS' && C.techRes[b]==='PASS' && isNum(C.evalP[b])) : null);
  const ep = B.filter(b=>C.elig[b]).map(b=>C.evalP[b]);
  C.low = ep.length ? Math.min(...ep) : null;
  C.ps = B.map(b=> C.elig[b] ? C.low/C.evalP[b] : null);
  C.total = B.map(b=> C.elig[b] ? C.tech[b]*W + C.ps[b]*(1-W) : null);
  C.rank = B.map(b=> C.elig[b] ? B.filter(x=>C.elig[x] && C.total[x]>C.total[b]).length+1 : null);
  C.outcome = B.map(b=>{
    if(!active(b)) return '';
    if(C.elig[b]) return C.rank[b]===1 ? 'RECOMMENDED FOR AWARD' : 'Ranked '+C.rank[b];
    if(C.comp[b].status!=='PASS') return 'Not eligible – compliance '+(C.comp[b].status||'').toLowerCase();
    if(C.techRes[b]!=='PASS') return 'Not eligible – technical '+(C.techRes[b]||'not scored').toLowerCase();
    return 'Not eligible – no evaluated price';
  });
  C.winner = B.find(b=>C.rank[b]===1);
  // sensitivity
  C.sens = S.sens.map(w=>B.map(b=> (C.elig[b] && isNum(w)) ? C.tech[b]*w + C.ps[b]*(1-w) : null));
  C.sensWin = C.sens.map(col=>topOf(col));
  const sw = C.sensWin.filter(i=>i>=0);
  C.robust = C.winner===undefined ? '' : (sw.every(i=>i===C.winner) ? 'Yes' : 'No – changes at some weightings');
  return C;
}

function evProgress(){
  const p = EVS.pack, crit = p.criteria.map((c,k)=>isNum(c.w)?k:-1).filter(k=>k>=0), bids = p.bidders.map((b,i)=>String(b).trim()?i:-1).filter(i=>i>=0);
  const done = crit.reduce((s,k)=>s+bids.filter(b=>isNum(EVS.scores[k][b])).length,0);
  return {done, total: crit.length*bids.length, crit, bids};
}

const fmtDT = iso => { if(!iso) return ''; const d = new Date(iso); return isNaN(d) ? esc(iso) : d.toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'}); };
const safe = s => String(s||'').replace(/[^\w-]+/g,'_').replace(/^_+|_+$/g,'') || 'tender';
function downloadText(text, name, type){
  const blob = new Blob([text],{type});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
/* App source without the lead-only code (scoring-form builder, score import, trial builder). */
function stripFull(){
  const A = '/*FULL' + '-START*/', Z = '/*FULL' + '-END*/';
  const src = document.getElementById('app').textContent; let out = '', i = 0;
  for(;;){ const a = src.indexOf(A, i); if(a < 0){ out += src.slice(i); break; } const z = src.indexOf(Z, a); out += src.slice(i, a); i = z + Z.length; }
  return out;
}

/* Builds a standalone evaluator scoring form: same app code, pack embedded, locked to evaluator mode. */
function buildFormHTML(pack){
  const css = document.querySelector('style').textContent;
  const app = stripFull();
  const data = JSON.stringify(pack).replace(/</g,'\\u003c');
  const title = 'Scoring form – ' + pack.evaluator + ' – ' + (pack.project.ref || pack.project.title || 'Tender');
  return '<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n'
    + '<title>' + esc(title) + '</title>\n<style>' + css + '</style>\n</head>\n<body>\n'
    + '<header id="hdr"></header>\n<div class="status" id="status"></div>\n<nav id="nav"></nav>\n<main id="main"></main>\n'
    + '<script>window.EMBED_PACK = ' + data + ';<\/script>\n'
    + '<script id="app">' + app + '<\/script>\n</body>\n</html>\n';
}
function download(obj, name){
  const blob = new Blob([JSON.stringify(obj,null,1)],{type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
function readFiles(ev, handler){
  const files = [...ev.target.files]; ev.target.value = '';
  files.forEach(f=>{ const r = new FileReader();
    r.onload = () => { let d; try{ d = JSON.parse(r.result); }catch(x){ alert(f.name+' is not a valid file.'); return; } handler(d, f.name); };
    r.readAsText(f); });
}
function createPack(e){
  if(!S.evaluators[e].trim()){ alert('Enter this evaluator\'s name on Setup first.'); return; }
  const C = compute();
  if(C.nCrit===0){ alert('Add criteria and weights on the Technical tab first.'); return; }
  if(!S.bidders.some(b=>b.trim())){ alert('Add bidders on Setup first.'); return; }
  if(Math.abs(C.totalW-1)>1e-6 && !confirm('Weights do not total 100%. Create the pack anyway?')) return;
  const fp = fingerprint(S.bidders, S.criteria), issued = new Date().toISOString();
  const pack = {kind:'tem-pack', v:1, tenderId:S.tenderId, fp, e, evaluator:S.evaluators[e].trim(), issued,
    project:{title:S.project.title, ref:S.project.ref, client:S.project.client},
    bidders:S.bidders, criteria:S.criteria, scale:S.scale};
  S.packs[e] = {at:issued, fp}; save(); render();
  downloadText(buildFormHTML(pack), `${safe(S.project.ref)}_SCORING_FORM_${safe(S.evaluators[e])}.html`, 'text/html');
}
/*FULL-END*/
function cleanGrid(g){ return arr(S.criteria.length,k=>arr(NB,b=>{ const v = g && g[k] ? g[k][b] : null; return (typeof v==='number' && v>=0 && v<=5) ? Math.round(v) : null; })); }
function openPack(d, name){
  if(!d || d.kind!=='tem-pack'){ alert(name+' is not an evaluator pack.' + (d && d.kind==='tem-scores' ? ' It is a score file — the tender lead imports it on the Panel Packs tab.' : '')); return; }
  if(MODE==='lead' && !window.EMBED_PACK && !confirm(`Open the scoring pack for ${d.evaluator}? The tool switches to evaluator mode. Any lead data on this computer stays saved but hidden until you exit evaluator mode.`)) return;
  const key = KEY+'-eval-'+d.tenderId+'-'+d.e;
  let ev = null; try{ ev = JSON.parse(localStorage.getItem(key) || 'null'); }catch(x){}
  if(ev && ev.pack){
    if(ev.fp !== d.fp) alert('This is an updated pack (criteria or bidders changed). Your earlier scores were kept — please check every row.');
    ev.pack = d; ev.fp = d.fp;
    const n = d.criteria.length;
    ev.scores = arr(n, k => ev.scores[k] || arr(NB,null)); ev.comments = arr(n, k => ev.comments[k] || '');
  } else ev = {pack:d, fp:d.fp, scores:arr(d.criteria.length,()=>arr(NB,null)), comments:arr(d.criteria.length,''), coi:{ok:'',date:''}, submitted:null};
  EVS = ev; EVKEY = key; MODE = 'eval'; tab = 'mine'; save(); render(); window.scrollTo(0,0);
}
function exitEval(){
  if(!confirm('Exit evaluator mode? Your scores stay saved on this computer — reopen the pack file to continue.')) return;
  save(); MODE = 'lead'; EVS = null; EVKEY = null; tab = 'setup'; save(); render();
}
function submitScores(){
  const p = EVS.pack, pr = evProgress();
  if(!EVS.coi.ok){ alert('Please complete the conflict-of-interest declaration first.'); return; }
  if(pr.done < pr.total && !confirm(`${pr.total - pr.done} score(s) are still blank. Submit anyway?`)) return;
  const out = {kind:'tem-scores', v:1, tenderId:p.tenderId, fp:p.fp, e:p.e, evaluator:p.evaluator, submitted:new Date().toISOString(),
    scores:EVS.scores, comments:EVS.comments, coi:EVS.coi};
  EVS.submitted = out.submitted; save(); render();
  download(out, `${safe(p.project.ref)}_SCORES_${safe(p.evaluator)}.json`);
}

function importScores(d, name){
  if(!d || d.kind!=='tem-scores'){ alert(name+' is not an evaluator score file.'); return; }
  if(d.tenderId !== S.tenderId){ alert(`${name} belongs to a different tender (ID ${d.tenderId}) and was not imported.`); return; }
  const e = d.e;
  if(!(e>=0 && e<NE)){ alert(name+' has an invalid evaluator slot.'); return; }
  if(d.fp !== fingerprint(S.bidders, S.criteria) &&
     !confirm(`${d.evaluator} scored an older version of the criteria or bidder list. Scores are matched by row and column position. Import anyway?`)) return;
  if(S.scores[e].some(r=>r.some(isNum)) && !confirm(`Replace the scores already in ${ename(e)}'s sheet with ${d.evaluator}'s file submitted ${fmtDT(d.submitted)}?`)) return;
  S.scores[e] = cleanGrid(d.scores);
  S.comments[e] = arr(S.criteria.length,k=>String((d.comments||[])[k]||''));
  S.coi[e] = {ok: (d.coi&&d.coi.ok)||'', date: (d.coi&&d.coi.date)||''};
  S.subs[e] = {at:d.submitted, name:d.evaluator};
  save(); render();
}

function exportJSON(){
  const blob = new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = (S.project.ref||'tender-evaluation').replace(/[^\w-]+/g,'_')+'.json'; a.click();
}
function importJSON(ev){
  const f = ev.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => { try{
      const d = JSON.parse(r.result);
      if(d.kind==='tem-pack'){ alert('That is an evaluator pack — use “Open evaluator pack”.'); return; }
      if(d.kind==='tem-scores'){ alert('That is an evaluator score file — import it on the Panel Packs tab.'); return; }
      if(!d.project || !d.bidders){ throw new Error('bad'); }
      S = normalize(Object.assign(blank(), d)); save(); render();
    }catch(e){ alert('That file is not a valid backup.'); } };
  r.readAsText(f); ev.target.value='';
